<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 电子宠物健康管理</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 400px; background: white; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); padding: 20px; text-align: center; }
        h1 { color: #333; font-size: 24px; margin-bottom: 10px; }
        .pet-area { font-size: 80px; margin: 20px 0; transition: transform 0.3s; }
        .pet-area.happy { transform: scale(1.1); }
        .pet-area.sad { filter: grayscale(100%); }
        .status-bar { background: #eee; border-radius: 10px; margin: 10px 0; overflow: hidden; height: 20px; text-align: left; }
        .status-fill { height: 100%; color: white; font-size: 12px; padding-left: 10px; line-height: 20px; transition: width 0.5s; }
        .food-fill { background: #ff6b6b; }
        .energy-fill { background: #4ecdc4; }
        .chat-box { background: #f8f9fa; border-radius: 10px; padding: 15px; margin: 15px 0; min-height: 60px; font-size: 14px; color: #555; border: 1px solid #ddd; }
        .controls { display: flex; flex-direction: column; gap: 10px; }
        button, input[type="file"] { padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button { background: #4a90e2; color: white; }
        button:active { background: #357abd; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>我的 AI 健康宠物</h1>
    
    <!-- 宠物展示区 -->
    <div id="pet" class="pet-area">🐶</div>
    
    <!-- 状态条 -->
    <div>饱食度 (热量越低越好)</div>
    <div class="status-bar"><div id="foodBar" class="status-fill food-fill" style="width: 80%;">80%</div></div>
    
    <div>活力值 (步数越多越好)</div>
    <div class="status-bar"><div id="energyBar" class="status-fill energy-fill" style="width: 50%;">50%</div></div>

    <!-- 宠物对话区 -->
    <div id="chatBox" class="chat-box">主人，今天想吃什么呀？拍给我看看吧！</div>

    <!-- 操作区 -->
    <div class="controls">
        <input type="file" id="imageUpload" accept="image/*" class="hidden">
        <button onclick="document.getElementById('imageUpload').click()">📸 拍照识别热量</button>
        <button onclick="simulateWalk()">🚶 模拟散步 (增加步数)</button>
    </div>
</div>

<script>
    // 1. 初始化宠物状态 (从本地存储读取，如果没有则默认)
    let petState = JSON.parse(localStorage.getItem('petState')) || {
        food: 80,  // 饱食度/健康度
        energy: 50, // 活力值
        steps: 2000
    };

    // 你的 API Key (期末演示用，建议用免费的通义千问或智谱)
    const API_KEY = "在这里填入你的_API_Key"; 

    // 页面加载时更新UI
    updateUI();

    // 更新界面显示
    function updateUI() {
        document.getElementById('foodBar').style.width = petState.food + '%';
        document.getElementById('foodBar').innerText = petState.food + '%';
        document.getElementById('energyBar').style.width = petState.energy + '%';
        document.getElementById('energyBar').innerText = petState.energy + '%';
        
        const pet = document.getElementById('pet');
        if (petState.food < 40 || petState.energy < 30) {
            pet.className = 'pet-area sad';
            pet.innerText = '🐶'; // 可以换成生病的图
        } else {
            pet.className = 'pet-area happy';
            pet.innerText = '🐕'; // 开心的图
        }
        
        // 保存到本地
        localStorage.setItem('petState', JSON.stringify(petState));
    }

    // 模拟散步
    function simulateWalk() {
        petState.steps += 1000;
        petState.energy = Math.min(100, petState.energy + 10);
        updateUI();
        speak(`太棒啦！我们今天走了 ${petState.steps} 步，我感觉精力充沛！`);
    }

    // 处理图片上传
    document.getElementById('imageUpload').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async function(event) {
            const base64Image = event.target.result;
            speak("正在分析食物热量，请稍候...");
            
            // 2. 调用视觉大模型 API (这里以通用格式为例，实际需根据你选的API修改)
            try {
                const response = await fetch('https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: "qwen-vl-max",
                        input: {
                            messages: [{
                                role: "user",
                                content: [
                                    { image: base64Image },
                                    { text: "请识别图片中的食物，并估算总热量（大卡）。请只返回JSON格式：{\"food\": \"食物名\", \"calories\": 数字}" }
                                ]
                            }]
                        }
                    }
                });
                
                const data = await response.json();
                // 假设返回的文本在 output.choices[0].message.content[0].text 中
                const aiText = data.output.choices[0].message.content[0].text;
                const result = JSON.parse(aiText);
                
                // 3. 根据热量更新状态
                if (result.calories > 500) {
                    petState.food = Math.max(0, petState.food - 30); // 热量高，健康度大减
                    speak(`天呐，你吃了 ${result.food}，有 ${result.calories} 大卡！太油腻了，我肚子好难受...`);
                } else {
                    petState.food = Math.min(100, petState.food + 10); // 热量低，健康度增加
                    speak(`哇，${result.food} 看起来很健康，只有 ${result.calories} 大卡，我吃饱啦！`);
                }
                updateUI();
                
            } catch (error) {
                console.error("API调用失败:", error);
                speak("哎呀，我脑子短路了，识别失败了... (请检查API Key)");
            }
        };
        reader.readAsDataURL(file);
    });

    // 宠物说话
    function speak(text) {
        document.getElementById('chatBox').innerText = text;
    }
</script>

</body>
</html>
