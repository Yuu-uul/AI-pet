<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 电子宠物健康管理</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 16px;
    color: #333;
  }
  .container { max-width: 420px; margin: 0 auto; }

  /* ===== 天气栏 ===== */
  .weather {
    background: rgba(255,255,255,0.95);
    border-radius: 16px;
    padding: 12px 16px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }
  .weather-main { display: flex; align-items: center; gap: 10px; }
  .weather-icon { font-size: 32px; }
  .weather-temp { font-size: 22px; font-weight: bold; color: #667eea; }
  .weather-desc { font-size: 13px; color: #666; }
  .weather-loc { font-size: 11px; color: #999; }

  /* ===== 宠物卡片 ===== */
  .card {
    background: rgba(255,255,255,0.95);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    transform-style: preserve-3d;
    perspective: 1000px;
    transition: transform 0.3s, box-shadow 0.3s;
  }
  .card:hover {
    transform: rotateX(2deg) rotateY(-2deg) translateZ(10px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }
  .pet-area { text-align: center; padding: 10px 0; }
  .pet {
    font-size: 80px;
    display: inline-block;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    filter: drop-shadow(0 6px 12px rgba(0,0,0,0.2));
  }
  .pet.bounce { transform: scale(1.3) rotateY(360deg) translateZ(30px); }
  .pet-name { font-size: 18px; font-weight: bold; margin-top: 8px; }
  .pet-mood { font-size: 13px; color: #888; margin-top: 4px; }

  /* ===== 状态条 ===== */
  .bars { margin-top: 16px; }
  .bar-item { margin-bottom: 12px; }
  .bar-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #666;
    margin-bottom: 4px;
  }
  .bar-track {
    height: 10px;
    background: #eee;
    border-radius: 5px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 5px;
    transition: width 0.6s ease;
    box-shadow: inset 0 2px 4px rgba(255,255,255,0.4);
  }
  .fill-green { background: linear-gradient(90deg, #4ade80, #22c55e); }
  .fill-orange { background: linear-gradient(90deg, #fb923c, #f97316); }
  .fill-red { background: linear-gradient(90deg, #f87171, #ef4444); }
  .fill-blue { background: linear-gradient(90deg, #60a5fa, #3b82f6); }

  /* ===== 按钮 ===== */
  .btn-row { display: flex; gap: 8px; margin-top: 16px; }
  button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    color: #fff;
    box-shadow: 0 4px 0 rgba(0,0,0,0.15);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  button:active {
    transform: translateY(4px);
    box-shadow: 0 0 0 rgba(0,0,0,0.15);
  }
  .btn-walk { background: linear-gradient(135deg, #4ade80, #22c55e); }
  .btn-sleep { background: linear-gradient(135deg, #60a5fa, #3b82f6); }
  .btn-photo { background: linear-gradient(135deg, #fb923c, #f97316); }
  .btn-reset { background: linear-gradient(135deg, #94a3b8, #64748b); }

  /* ===== 记录区 ===== */
  .log {
    background: rgba(255,255,255,0.95);
    border-radius: 20px;
    padding: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }
  .log h3 { font-size: 15px; margin-bottom: 10px; color: #444; }
  .log-item {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #f0f0f0;
    font-size: 13px;
  }
  .log-item:last-child { border-bottom: none; }
  .log-time { color: #999; font-size: 11px; }
  .empty { text-align: center; color: #bbb; font-size: 13px; padding: 20px 0; }

  /* ===== 提示气泡 ===== */
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: rgba(0,0,0,0.85);
    color: #fff;
    padding: 12px 20px;
    border-radius: 30px;
    font-size: 14px;
    z-index: 999;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    max-width: 90%;
    text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  input[type="file"] { display: none; }
</style>
</head>
<body>
<div class="container">

  <!-- 天气 -->
  <div class="weather">
    <div class="weather-main">
      <div class="weather-icon" id="wIcon">⛅</div>
      <div>
        <div class="weather-temp" id="wTemp">--°C</div>
        <div class="weather-desc" id="wDesc">天气加载中...</div>
      </div>
    </div>
    <div class="weather-loc" id="wLoc">📍 定位中</div>
  </div>

  <!-- 宠物 -->
  <div class="card">
    <div class="pet-area">
      <div class="pet" id="petEmoji">🐱</div>
      <div class="pet-name">小Q</div>
      <div class="pet-mood" id="petMood">心情不错～</div>
    </div>

    <div class="bars">
      <div class="bar-item">
        <div class="bar-label"><span>步数</span><span id="stepVal">0 / 8000</span></div>
        <div class="bar-track"><div class="bar-fill fill-green" id="stepBar" style="width:0%"></div></div>
      </div>
      <div class="bar-item">
        <div class="bar-label"><span>热量额度剩余（吃得越多剩越少）</span><span id="calVal">0 kcal</span></div>
        <div class="bar-track"><div class="bar-fill fill-red" id="calBar" style="width:100%"></div></div>
      </div>
      <div class="bar-item">
        <div class="bar-label"><span>睡眠</span><span id="sleepVal">0 h</span></div>
        <div class="bar-track"><div class="bar-fill fill-blue" id="sleepBar" style="width:0%"></div></div>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn-walk" onclick="addWalk()">🚶 散步</button>
      <button class="btn-sleep" onclick="addSleep()">😴 早睡</button>
      <button class="btn-photo" onclick="document.getElementById('photoInput').click()">📷 拍照</button>
    </div>
    <div class="btn-row" style="margin-top:8px;">
      <button class="btn-reset" onclick="resetData()">🔄 重置今日数据</button>
    </div>
    <input type="file" id="photoInput" accept="image/*" capture="environment" onchange="handlePhoto(event)">
  </div>

  <!-- 记录 -->
  <div class="log">
    <h3>📋 今日记录</h3>
    <div id="logList"><div class="empty">还没有记录，快去运动吧～</div></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// ===== 数据 =====
var today = new Date().toISOString().slice(0, 10);
var state = {
  date: today,
  steps: 2000,
  calories: 0,
  sleep: 6,
  logs: []
};

// 读取本地存储
try {
  var saved = JSON.parse(localStorage.getItem('petData'));
  if (saved && saved.date === today) {
    state = saved;
  }
} catch (e) {}

// ===== 渲染 =====
function render() {
  // 步数
  var stepPct = Math.min(100, state.steps / 8000 * 100);
  document.getElementById('stepBar').style.width = stepPct + '%';
  document.getElementById('stepVal').textContent = state.steps + ' / 8000';

  // 热量（额度剩余，吃得越多剩越少）
  var calLeft = Math.max(0, 2000 - state.calories);
  var calPct = calLeft / 2000 * 100;
  var calBar = document.getElementById('calBar');
  calBar.style.width = calPct + '%';
  calBar.className = 'bar-fill ' + (calPct > 50 ? 'fill-green' : calPct > 20 ? 'fill-orange' : 'fill-red');
  document.getElementById('calVal').textContent = state.calories + ' kcal';

  // 睡眠
  var sleepPct = Math.min(100, state.sleep / 8 * 100);
  document.getElementById('sleepBar').style.width = sleepPct + '%';
  document.getElementById('sleepVal').textContent = state.sleep + ' h';

  // 宠物状态
  updatePet();

  // 记录列表
  var list = document.getElementById('logList');
  if (state.logs.length === 0) {
    list.innerHTML = '<div class="empty">还没有记录，快去运动吧～</div>';
  } else {
    list.innerHTML = state.logs.slice().reverse().map(function(log) {
      return '<div class="log-item"><span>' + log.text + '</span><span class="log-time">' + log.time + '</span></div>';
    }).join('');
  }

  // 保存
  localStorage.setItem('petData', JSON.stringify(state));
}

// ===== 宠物情绪 =====
function updatePet() {
  var emoji = '🐱';
  var mood = '心情不错～';

  if (state.calories > 1500) {
    emoji = '🙀';
    mood = '吃太多了，好撑...';
  } else if (state.sleep < 7) {
    emoji = '😿';
    mood = '没睡够，好困...';
  } else if (state.steps < 4000) {
    emoji = '😾';
    mood = '动得太少了，想出去走走！';
  } else if (state.steps >= 8000 && state.sleep >= 8 && state.calories < 1200) {
    emoji = '😸';
    mood = '今天超棒！继续保持～';
  }

  document.getElementById('petEmoji').textContent = emoji;
  document.getElementById('petMood').textContent = mood;
}

// ===== 动作 =====
function addWalk() {
  var add = Math.floor(Math.random() * 800) + 400;
  state.steps += add;
  addLog('🚶 散步 ' + add + ' 步');
  bounce();
  render();
  showToast('+' + add + ' 步，真棒！');
}

function addSleep() {
  state.sleep += 1;
  addLog('😴 早睡 +1 小时');
  bounce();
  render();
  showToast('睡眠 +1 小时');
}

function handlePhoto(e) {
  var file = e.target.files[0];
  if (!file) return;

  // 模拟 AI 识别（真实项目接 API）
  var fakeCal = Math.floor(Math.random() * 400) + 150;
  state.calories += fakeCal;
  addLog('📷 拍照识别：约 ' + fakeCal + ' kcal');
  bounce();
  render();
  showToast('识别到约 ' + fakeCal + ' kcal');
  e.target.value = '';
}

function addLog(text) {
  var now = new Date();
  var time = now.getHours() + ':' + String(now.getMinutes()).padStart(2, '0');
  state.logs.push({ text: text, time: time });
}

function resetData() {
  if (!confirm('确定重置今日数据？')) return;
  state = { date: today, steps: 2000, calories: 0, sleep: 6, logs: [] };
  render();
  showToast('已重置');
}

function bounce() {
  var pet = document.getElementById('petEmoji');
  pet.classList.add('bounce');
  setTimeout(function() { pet.classList.remove('bounce'); }, 500);
}

// ===== 提示 =====
function showToast(msg) {
  var toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(function() { toast.classList.remove('show'); }, 2000);
}

// ===== 天气 =====
function loadWeather(lat, lon) {
  document.getElementById('wLoc').textContent = '📍 定位成功';
  fetch('https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon + '&current_weather=true')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var w = d.current_weather;
      document.getElementById('wTemp').textContent = Math.round(w.temperature) + '°C';
      document.getElementById('wDesc').textContent = getWeatherText(w.weathercode);
      document.getElementById('wIcon').textContent = getWeatherIcon(w.weathercode);
    })
    .catch(function() {
      document.getElementById('wDesc').textContent = '天气加载失败';
      document.getElementById('wLoc').textContent = '📍 网络异常';
    });
}

function getWeatherText(code) {
  if (code === 0) return '晴';
  if (code <= 3) return '多云';
  if (code <= 48) return '雾';
  if (code <= 67) return '雨';
  if (code <= 77) return '雪';
  if (code <= 82) return '阵雨';
  return '雷暴';
}

function getWeatherIcon(code) {
  if (code === 0) return '☀️';
  if (code <= 3) return '⛅';
  if (code <= 48) return '🌫️';
  if (code <= 67) return '🌧️';
  if (code <= 77) return '🌨️';
  if (code <= 82) return '🌦️';
  return '⛈️';
}

// 定位
if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(
    function(pos) {
      loadWeather(pos.coords.latitude, pos.coords.longitude);
    },
    function() {
      // 定位失败，用深圳坐标
      document.getElementById('wLoc').textContent = '📍 深圳（默认）';
      loadWeather(22.54, 114.06);
    },
    { timeout: 5000 }
  );
} else {
  document.getElementById('wLoc').textContent = '📍 深圳（默认）';
  loadWeather(22.54, 114.06);
}

// 初始渲染
render();
</script>
</body>
</html>
