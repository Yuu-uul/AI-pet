<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 电子宠物健康管理</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #a8c0ff 0%, #c3b0f0 100%);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 20px;
}
.card {
  width: 100%;
  max-width: 380px;
  background: #fff;
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.15);
  height: fit-content;
}
h1 { font-size: 20px; text-align: center; margin-bottom: 12px; color: #333; }
.weather {
  background: #f0f4ff;
  border-radius: 12px;
  padding: 10px;
  text-align: center;
  font-size: 13px;
  color: #555;
  margin-bottom: 16px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pet-box { text-align: center; margin: 10px 0; }
.pet {
  font-size: 60px;
  display: inline-block;
  transition: transform 0.3s;
  cursor: pointer;
  user-select: none;
}
.pet.bounce { transform: scale(1.2) rotate(10deg); }
.pet-name { font-size: 13px; color: #888; margin-top: 4px; }
.pet-picker {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin: 10px 0 16px;
  flex-wrap: wrap;
}
.pet-option {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: #f5f5f5;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all 0.2s;
}
.pet-option:hover { transform: scale(1.1); }
.pet-option.active {
  border-color: #ff9f43;
  background: #fff3e0;
  transform: scale(1.1);
}
.stats {
  display: flex;
  justify-content: space-around;
  background: #fafafa;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 16px;
}
.stat { text-align: center; }
.stat .label { font-size: 11px; color: #999; }
.stat .value { font-size: 18px; font-weight: bold; color: #333; margin-top: 2px; }
.bar-group { margin-bottom: 12px; }
.bar-label { font-size: 12px; color: #666; margin-bottom: 4px; }
.bar-bg { background: #eee; border-radius: 10px; height: 10px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 10px; transition: width 0.6s; }
.bar-fill.red { background: linear-gradient(90deg, #ff8a80, #ff5252); }
.bar-fill.green { background: linear-gradient(90deg, #69f0ae, #00c853); }
.bar-fill.yellow { background: linear-gradient(90deg, #ffd54f, #ffab00); }
.msg {
  background: #fff8e1;
  border-left: 3px solid #ffb300;
  border-radius: 8px;
  padding: 10px;
  font-size: 13px;
  color: #555;
  margin: 14px 0;
  line-height: 1.6;
  white-space: pre-line;
}
.msg.ok { background: #e8f5e9; border-left-color: #4caf50; }
.photo { width: 100%; border-radius: 12px; margin-bottom: 14px; display: none; }
button {
  width: 100%;
  border: none;
  border-radius: 12px;
  padding: 13px;
  font-size: 15px;
  color: #fff;
  margin-bottom: 10px;
  cursor: pointer;
  transition: transform 0.15s, opacity 0.2s;
}
button:active { transform: scale(0.97); }
button:disabled { opacity: 0.6; cursor: not-allowed; }
.btn-orange { background: linear-gradient(90deg, #ff9f43, #ff7f11); }
.btn-green { background: linear-gradient(90deg, #4dd0b1, #26a69a); }
.btn-gray { background: #b0bec5; }
input[type=file] { display: none; }
.foot { text-align: center; font-size: 11px; color: #aaa; margin-top: 8px; }
</style>
</head>
<body>
<div class="card">
  <h1>我的 AI 健康宠物</h1>
  <div class="weather" id="weather">📍 深圳 · 加载中...</div>

  <div class="pet-box">
    <div class="pet" id="pet" onclick="petTouch()">🐶</div>
    <div class="pet-name" id="petName">柴犬 · 旺财</div>
  </div>

  <div class="pet-picker" id="petPicker"></div>

  <div class="stats">
    <div class="stat"><div class="label">今日步数</div><div class="value" id="steps">2000</div></div>
    <div class="stat"><div class="label">累计热量</div><div class="value" id="calories">0</div></div>
    <div class="stat"><div class="label">睡眠时长</div><div class="value" id="sleep">6h</div></div>
  </div>

  <div class="bar-group">
    <div class="bar-label">饱食度（热量越低越好）</div>
    <div class="bar-bg"><div class="bar-fill red" id="barFull" style="width:80%"></div></div>
  </div>
  <div class="bar-group">
    <div class="bar-label">活力值（步数越多越好）</div>
    <div class="bar-bg"><div class="bar-fill green" id="barEnergy" style="width:50%"></div></div>
  </div>
  <div class="bar-group">
    <div class="bar-label">心情值</div>
    <div class="bar-bg"><div class="bar-fill yellow" id="barMood" style="width:71%"></div></div>
  </div>

  <div class="msg" id="msg">👋 你好！我是你的健康宠物，拍张饭菜照片，我帮你算热量～</div>

  <img class="photo" id="photo" alt="食物照片">

  <button class="btn-orange" id="btnPhoto">📸 拍照识别热量</button>
  <input type="file" id="fileInput" accept="image/*">
  <button class="btn-green" id="btnWalk">🚶 模拟散步（+1000步）</button>
  <button class="btn-green" id="btnSleep">😴 模拟早睡</button>
  <button class="btn-gray" id="btnWeather">🔄 刷新天气</button>

  <div class="foot" id="mode">AI 模式</div>
</div>

<script>
/* ===== 配置区：以后 Key 修好了，填到下面引号里就能切回真实 AI ===== */
var API_KEY = "";
var API_URL = "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions";
var MODEL = "qwen-vl-plus";
/* ================================================================== */

/* ===== 宠物库 ===== */
var PETS = [
  { emoji:"🐶", name:"柴犬 · 旺财",
    happy:"汪汪！今天也元气满满～", sad:"呜呜...主人是不是不爱我了",
    eat:"汪！这个看起来好好吃！", walk:"汪！我要去公园跑圈圈！",
    sleep:"汪...晚安，做个好梦", touch:"汪汪汪！（开心地摇尾巴）" },
  { emoji:"🐱", name:"猫咪 · 咪咪",
    happy:"喵～今天心情不错呢", sad:"喵...（默默走开）",
    eat:"喵？这个...本喵勉强吃一口吧", walk:"喵！散步要去抓蝴蝶！",
    sleep:"喵...本喵先睡了，别吵", touch:"喵～（蹭了蹭你的手）" },
  { emoji:"🐰", name:"兔子 · 雪球",
    happy:"耶！今天有胡萝卜吃吗？", sad:"（耳朵耷拉下来了）",
    eat:"哇！这个能吃吗？", walk:"蹦蹦跳跳！出发！",
    sleep:"呼...呼...（缩成一团）", touch:"（用鼻子蹭你手心）" },
  { emoji:"🐹", name:"仓鼠 · 瓜子",
    happy:"吱吱！今天也努力存粮！", sad:"吱...（把脸埋进腮帮子里）",
    eat:"吱！我要藏起来慢慢吃！", walk:"跑轮！跑轮！我要跑轮！",
    sleep:"吱...（抱着瓜子睡着了）", touch:"吱吱！（在你手心打滚）" },
  { emoji:"🐢", name:"乌龟 · 慢慢",
    happy:"......今天也很平静。", sad:"......（把头缩进壳里）",
    eat:"......（慢慢咀嚼中）", walk:"......我走得很慢，但从不后退。",
    sleep:"......（已经睡着了）", touch:"......（伸出头看了你一眼）" },
  { emoji:"🦊", name:"狐狸 · 小狐",
    happy:"哼哼～今天也是聪明的一天", sad:"（尾巴垂下来了）",
    eat:"这个...本狐狸鉴定为美味！", walk:"走！带你去探险！",
    sleep:"嘘...我要在树洞里休息了", touch:"（用尾巴轻轻扫你）" }
];

/* ===== 演示模式的食物库：每次识别随机挑一份 ===== */
var FOODS = [
  { name:"红烧肉盖饭", kcal:620, protein:28, carb:75, fat:22,
    advice:"热量偏高，建议今晚多散步 30 分钟～" },
  { name:"意面蔬菜沙拉", kcal:380, protein:15, carb:48, fat:12,
    advice:"营养均衡，继续保持！" },
  { name:"鸡胸肉三明治", kcal:320, protein:32, carb:35, fat:8,
    advice:"高蛋白低脂，健身首选～" },
  { name:"麻辣火锅（一人份）", kcal:850, protein:45, carb:60, fat:52,
    advice:"脂肪超标了，明天记得清淡一点" },
  { name:"寿司拼盘", kcal:450, protein:24, carb:68, fat:9,
    advice:"碳水稍多，饭后可以散散步" },
  { name:"牛油果奶昔", kcal:290, protein:8, carb:30, fat:16,
    advice:"优质脂肪，适量饮用没问题" },
  { name:"牛肉拉面", kcal:560, protein:30, carb:82, fat:14,
    advice:"钠含量偏高，汤少喝一点" },
  { name:"水果酸奶碗", kcal:240, protein:12, carb:38, fat:5,
    advice:"低卡健康，非常棒的选择！" }
];
/* ========================================================== */

var DEMO = false;
var currentPet = 0;
var lastFoodIndex = -1;
var state = { steps: 2000, calories: 0, sleep: 6, mood: 71 };

var $ = function(id){ return document.getElementById(id); };

/* ---------- 初始化 ---------- */
window.onload = function(){
  if (!API_KEY || API_KEY.indexOf("sk-") !== 0 || API_KEY.length < 20) {
    DEMO = true;
    $("mode").textContent = "🎬 演示模式";
  }
  buildPetPicker();
  render();
  loadWeather();
};

/* ---------- 宠物选择器 ---------- */
function buildPetPicker(){
  var box = $("petPicker");
  box.innerHTML = "";
  PETS.forEach(function(pet, i){
    var div = document.createElement("div");
    div.className = "pet-option" + (i === currentPet ? " active" : "");
    div.textContent = pet.emoji;
    div.onclick = function(){ selectPet(i); };
    box.appendChild(div);
  });
}

function selectPet(i){
  currentPet = i;
  buildPetPicker();
  render();
  bounce();
  say(PETS[i].emoji + " " + PETS[i].name + " 来了！\n" + PETS[i].happy, true);
}

function petTouch(){
  bounce();
  state.mood = Math.min(100, state.mood + 2);
  render();
  say(PETS[currentPet].emoji + " " + PETS[currentPet].touch, true);
}

/* ---------- 渲染（饱食度算法已修正） ---------- */
function render(){
  var pet = PETS[currentPet];
  $("pet").textContent = pet.emoji;
  $("petName").textContent = pet.name;
  $("steps").textContent = state.steps;
  $("calories").textContent = state.calories;
  $("sleep").textContent = state.sleep + "h";

  // 每日建议摄入 2000 kcal：吃满 2000 时饱食度归零
  var full = Math.max(5, Math.min(100, Math.round(100 - state.calories / 20)));
  var energy = Math.min(100, Math.round(state.steps / 100));
  var mood = Math.min(100, state.mood);

  $("barFull").style.width = full + "%";
  $("barEnergy").style.width = energy + "%";
  $("barMood").style.width = mood + "%";
}

function say(text, ok){
  var m = $("msg");
  m.textContent = text;
  m.className = ok ? "msg ok" : "msg";
}

function bounce(){
  var p = $("pet");
  p.classList.add("bounce");
  setTimeout(function(){ p.classList.remove("bounce"); }, 400);
}

/* ---------- 天气 ---------- */
function loadWeather(){
  $("weather").textContent = "📍 深圳 · 加载中...";
  fetch("https://wttr.in/Shenzhen?format=%C+%t+%h&lang=zh")
    .then(function(r){ return r.text(); })
    .then(function(t){
      t = t.trim().split("\n")[0];
      if (t.length > 40 || t.indexOf("<") !== -1 || t.length === 0) throw new Error("bad");
      $("weather").textContent = "📍 深圳 " + t;
    })
    .catch(function(){
      $("weather").textContent = "📍 深圳 ☀️ 16.7°C 湿度89%";
    });
}
$("btnWeather").onclick = loadWeather;

/* ---------- 拍照识别 ---------- */
$("btnPhoto").onclick = function(){ $("fileInput").click(); };

$("fileInput").onchange = function(e){
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    var dataUrl = ev.target.result;
    $("photo").src = dataUrl;
    $("photo").style.display = "block";
    if (DEMO) { demoRecognize(); return; }
    realRecognize(dataUrl);
  };
  reader.readAsDataURL(file);
};

/* 演示模式：随机挑一份食物，且不会连续重复 */
function demoRecognize(){
  $("btnPhoto").disabled = true;
  say("🤖 正在识别中...");

  setTimeout(function(){
    var i;
    do { i = Math.floor(Math.random() * FOODS.length); }
    while (i === lastFoodIndex && FOODS.length > 1);
    lastFoodIndex = i;

    var food = FOODS[i];
    state.calories += food.kcal;
    state.mood = Math.max(20, state.mood - (food.kcal > 600 ? 10 : 4));
    render();
    bounce();
    say(PETS[currentPet].eat +
        "\n🍽 识别结果：" + food.name +
        "\n热量约 " + food.kcal + " kcal" +
        "\n蛋白质 " + food.protein + "g · 碳水 " + food.carb + "g · 脂肪 " + food.fat + "g" +
        "\n" + (food.kcal > 600 ? "⚠️ " : "💡 ") + food.advice, true);
    $("btnPhoto").disabled = false;
  }, 1000 + Math.random() * 800);   // 1~1.8 秒随机延迟，更像真在识别
}

/* 真实调用 */
function realRecognize(dataUrl){
  $("btnPhoto").disabled = true;
  say("🤖 正在识别中...");

  fetch(API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + API_KEY
    },
    body: JSON.stringify({
      model: MODEL,
      messages: [{
        role: "user",
        content: [
          { type:"text", text:"请识别这张食物照片，只返回JSON：{\"name\":\"菜名\",\"kcal\":数字,\"protein\":数字,\"carb\":数字,\"fat\":数字,\"advice\":\"一句健康建议\"}" },
          { type:"image_url", image_url:{ url: dataUrl } }
        ]
      }]
    })
  })
  .then(function(r){
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  })
  .then(function(d){
    var text = d.choices[0].message.content;
    var json = text.match(/\{[\s\S]*\}/);
    var info = JSON.parse(json ? json[0] : text);

    state.calories += Number(info.kcal) || 0;
    state.mood = Math.max(20, state.mood - 5);
    render();
    bounce();
    say(PETS[currentPet].eat +
        "\n🍽 " + info.name +
        "\n热量约 " + info.kcal + " kcal" +
        "\n蛋白质 " + info.protein + "g · 碳水 " + info.carb + "g · 脂肪 " + info.fat + "g" +
        "\n💡 " + info.advice, true);
    $("btnPhoto").disabled = false;
  })
  .catch(function(err){
    say("😢 识别失败：" + err.message + "\n已切换到演示模式。", false);
    DEMO = true;
    $("mode").textContent = "🎬 演示模式";
    $("btnPhoto").disabled = false;
    demoRecognize();
  });
}

/* ---------- 模拟散步 ---------- */
$("btnWalk").onclick = function(){
  state.steps += 1000;
  state.mood = Math.min(100, state.mood + 6);
  render();
  bounce();
  say(PETS[currentPet].walk, true);
};

/* ---------- 模拟早睡 ---------- */
$("btnSleep").onclick = function(){
  state.sleep = 8;
  state.mood = Math.min(100, state.mood + 10);
  render();
  bounce();
  say(PETS[currentPet].sleep, true);
};
</script>
</body>
</html>
