<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 电子宠物健康管理</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #a8c0ff 0%, #f0f4f8 100%);
    min-height: 100vh; margin: 0; padding: 20px;
    display: flex; justify-content: center;
  }
  .box {
    width: 100%; max-width: 420px; background: #fff;
    border-radius: 20px; padding: 24px; text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,.12);
  }
  h2 { margin: 0 0 6px; color: #333; }
  .weather {
    font-size: 13px; color: #666; background: #f0f7ff;
    border-radius: 10px; padding: 8px; margin-bottom: 14px;
  }
  .pet { font-size: 72px; margin: 8px 0; transition: transform .3s; }
  .pet.bounce { transform: scale(1.15); }
  .label { font-size: 13px; color: #888; text-align: left; margin-top: 10px; }
  .bar { background: #eee; border-radius: 10px; height: 18px; overflow: hidden; }
  .fill { height: 100%; color: #fff; font-size: 11px; line-height: 18px; padding-left: 8px; text-align: left; transition: width .5s; }
  #foodBar { background: #ff6b6b; }
  #energyBar { background: #4ecdc4; }
  #moodBar { background: #ffd93d; }
  #chat {
    background: #f8f9fa; border: 1px solid #e3e3e3; border-radius: 12px;
    padding: 14px; min-height: 60px; font-size: 14px; color: #555;
    margin: 16px 0; text-align: left; line-height: 1.6;
  }
  #preview {
    max-width: 100%; max-height: 160px; border-radius: 10px;
    margin: 10px 0; display: none;
  }
  button {
    width: 100%; padding: 12px; margin: 6px 0; border: none;
    border-radius: 8px; background: #4a90e2; color: #fff;
    font-size: 15px; cursor: pointer;
  }
  button:active { background: #357abd; transform: scale(.98); }
  button:disabled { background: #b2bec3; cursor: not-allowed; }
  .btn-green { background: #4ecdc4; }
  .btn-orange { background: #ff9f43; }
  .btn-gray { background: #b2bec3; }
  .hidden { display: none; }
  .calorie-tag {
    display: inline-block; background: #ff6b6b; color: #fff;
    border-radius: 20px; padding: 2px 10px; font-size: 12px; margin-top: 6px;
  }
  .stats {
    display: flex; justify-content: space-around;
    background: #f8f9fa; border-radius: 10px; padding: 8px;
    margin-bottom: 14px; font-size: 12px; color: #666;
  }
  .stats b { display: block; font-size: 15px; color: #333; }
</style>
</head>
<body>

<div class="box">
  <h2>我的 AI 健康宠物</h2>
  <div class="weather" id="weather">🌤 正在获取天气...</div>

  <div class="pet" id="pet">🐶</div>

  <div class="stats">
    <div>今日步数<b id="stepNum">2000</b></div>
    <div>累计热量<b id="calNum">0</b></div>
    <div>睡眠时长<b id="sleepNum">6h</b></div>
  </div>

  <div class="label">饱食度（热量越低越好）</div>
  <div class="bar"><div class="fill" id="foodBar">80%</div></div>

  <div class="label">活力值（步数越多越好）</div>
  <div class="bar"><div class="fill" id="energyBar">50%</div></div>

  <div class="label">心情值</div>
  <div class="bar"><div class="fill" id="moodBar">70%</div></div>

  <div id="chat">主人，今天想吃什么呀？拍给我看看吧！</div>
  <img id="preview" alt="食物预览">

  <input type="file" id="fileInput" accept="image/*" class="hidden">
  <button id="btnPhoto" class="btn-orange">📸 拍照识别热量</button>
  <button id="btnWalk" class="btn-green">🚶 模拟散步（+1000步）</button>
  <button id="btnSleep" class="btn-green">😴 模拟早睡</button>
  <button id="btnWeather" class="btn-gray">🔄 刷新天气</button>
  <button id="btnReset" class="btn-gray">↺ 重置数据</button>
</div>

<script>
/* ===== 配置区：把你的 Key 粘贴到下面引号里 ===== */
var API_KEY = "sk-ws-H.XDLHPXI.Ffzy.MEUCIB9RyOca8OSY2GEj-BQjChqcXcoh7OkwMF8Pw1rtwmlxAiEA-LDQB4dsfMCfOkRkzTUc3NTijYYNBbZvM9W3Y-f5Jwk";
var API_URL = "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions";

/* ========== 1. 状态管理 ========== */
var state = JSON.parse(localStorage.getItem('petState')) || {
  food: 80, energy: 50, mood: 70, steps: 2000, sleep: 6, totalCalorie: 0
};
function save() { localStorage.setItem('petState', JSON.stringify(state)); }

/* ========== 2. 界面渲染 ========== */
function render() {
  setBar('foodBar', state.food);
  setBar('energyBar', state.energy);
  setBar('moodBar', state.mood);
  document.getElementById('stepNum').textContent = state.steps;
  document.getElementById('calNum').textContent = state.totalCalorie;
  document.getElementById('sleepNum').textContent = state.sleep + 'h';

  var pet = document.getElementById('pet');
  if (state.mood >= 80)      pet.textContent = '🐕';
  else if (state.mood >= 50) pet.textContent = '🐶';
  else if (state.mood >= 25) pet.textContent = '🐩';
  else                       pet.textContent = '🦮';

  pet.classList.add('bounce');
  setTimeout(function(){ pet.classList.remove('bounce'); }, 300);
  save();
}
function setBar(id, val) {
  var el = document.getElementById(id);
  el.style.width = val + '%';
  el.textContent = val + '%';
}
function say(t) { document.getElementById('chat').innerHTML = t; }

/* ========== 3. 心情系统 ========== */
function calcMood() {
  var sleepScore = Math.min(100, state.sleep * 14);
  var mood = Math.round(state.food * 0.35 + state.energy * 0.35 + sleepScore * 0.30);
  state.mood = Math.max(0, Math.min(100, mood));
}
function moodTalk() {
  if (state.mood >= 85)      say('哇！主人今天超自律，我是全世界最幸福的狗狗！🎉');
  else if (state.mood >= 65) say('今天状态不错哦，继续保持，我们一起变强！💪');
  else if (state.mood >= 45) say('嗯……有点小累，主人要不要陪我出去走走？');
  else if (state.mood >= 25) say('呜呜，我感觉不太舒服，主人是不是又熬夜了？😢');
  else                       say('我快撑不住了……求求主人早点睡觉，少吃点外卖吧！🥺');
}

/* ========== 4. 天气同步（免Key、免注册） ========== */
var WEATHER_CODE = {
  0:'☀️ 晴', 1:'🌤 大部晴朗', 2:'⛅ 多云', 3:'☁️ 阴',
  45:'🌫 雾', 48:'🌫 冻雾', 51:'🌦 毛毛雨', 53:'🌦 小雨', 55:'🌧 大雨',
  61:'🌧 小雨', 63:'🌧 中雨', 65:'⛈ 大雨', 71:'🌨 小雪', 73:'🌨 中雪',
  75:'❄️ 大雪', 80:'🌦 阵雨', 81:'🌧 阵雨', 82:'⛈ 强阵雨',
  95:'⛈ 雷阵雨', 96:'⛈ 雷阵雨伴冰雹', 99:'⛈ 强雷暴'
};
function loadWeather() {
  document.getElementById('weather').textContent = '🌤 正在获取天气...';
  var url = 'https://api.open-meteo.com/v1/forecast'
          + '?latitude=22.5431&longitude=114.0579'
          + '&current=temperature_2m,weather_code,relative_humidity_2m'
          + '&timezone=Asia/Shanghai';
  fetch(url)
    .then(function(r){ return r.json(); })
    .then(function(d){
      var c = d.current;
      var desc = WEATHER_CODE[c.weather_code] || '🌡 未知天气';
      document.getElementById('weather').textContent =
        '📍 深圳 ' + desc + ' ' + c.temperature_2m + '°C  湿度' + c.relative_humidity_2m + '%';
      weatherTalk(c.weather_code, c.temperature_2m);
    })
    .catch(function(){
      document.getElementById('weather').textContent = '⚠️ 天气获取失败，请检查网络';
    });
}
function weatherTalk(code, temp) {
  if (code >= 61 && code <= 82) {
    state.mood = Math.max(0, state.mood - 8);
    say('外面下雨了，主人记得带伞哦！不过我有点想窝在家里……☔');
  } else if (temp >= 33) {
    state.mood = Math.max(0, state.mood - 5);
    say('好热呀！今天 ' + temp + '°C，主人多喝水，别把我晒化了～🥵');
  } else if (code === 0) {
    state.mood = Math.min(100, state.mood + 6);
    say('今天是大晴天！阳光真好，主人快带我去户外跑一圈吧！☀️');
  } else {
    say('今天天气还行，主人出门记得注意安全哦～');
  }
  render();
}

/* ========== 5. 拍照识别热量 ========== */
var fileInput = document.getElementById('fileInput');
var preview = document.getElementById('preview');
var btnPhoto = document.getElementById('btnPhoto');

btnPhoto.onclick = function() { fileInput.click(); };

fileInput.onchange = function(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    var base64 = ev.target.result;
    preview.src = base64;
    preview.style.display = 'block';
    recognizeFood(base64);
  };
  reader.readAsDataURL(file);
};

function recognizeFood(base64) {
  if (API_KEY.indexOf('sk-在这里') === 0) {
    say('⚠️ 请先在代码顶部 <b>API_KEY</b> 那一行填入你的阿里云百炼 Key！');
    return;
  }
  btnPhoto.disabled = true;
  btnPhoto.textContent = '🤖 AI 正在识别中...';
  say('让我看看主人吃了什么……🔍');

  fetch(API_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + API_KEY
    },
    body: JSON.stringify({
      model: 'qwen-vl-plus',
      messages: [{
        role: 'user',
        content: [
          { type: 'image_url', image_url: { url: base64 } },
          { type: 'text', text: '你是营养分析助手。请识别图片中的食物，严格只返回JSON格式，不要任何多余文字和markdown标记。格式：{"name":"食物名称","calorie":数字,"advice":"一句话健康建议"}。calorie为这顿饭的总热量估算值（大卡）。' }
        ]
      }]
    })
  })
  .then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(function(data) {
    var text = data.choices[0].message.content;
    var clean = text.replace(/```json|```/g, '').trim();
    var result = JSON.parse(clean);
    applyFoodEffect(result.name, parseInt(result.calorie) || 0, result.advice);
  })
  .catch(function(err) {
    console.error(err);
    say('😥 识别失败了：' + err.message + '<br>请检查 API Key 是否正确、网络是否通畅。');
  })
  .finally(function() {
    btnPhoto.disabled = false;
    btnPhoto.textContent = '📸 拍照识别热量';
    fileInput.value = '';
  });
}

/* ===== 热量 → 宠物状态同步 ===== */
function applyFoodEffect(name, calorie, advice) {
  state.totalCalorie += calorie;
  var delta = Math.round((600 - calorie) / 6);
  delta = Math.max(-40, Math.min(25, delta));
  state.food = Math.max(0, Math.min(100, state.food + delta));

  calcMood();
  render();

  var tag = '<span class="calorie-tag">' + name + ' · 约 ' + calorie + ' 大卡</span><br>';
  if (calorie > 800) {
    say(tag + '天哪！' + calorie + ' 大卡！😱 这顿太丰盛了，我心情值掉了 ' + Math.abs(delta) + ' 点……<br>' + (advice || ''));
  } else if (calorie > 500) {
    say(tag + '嗯，' + calorie + ' 大卡，还算正常的一餐。😌<br>' + (advice || ''));
  } else {
    say(tag + '哇！只有 ' + calorie + ' 大卡，主人真自律！我心情值 +' + delta + '！🎉<br>' + (advice || ''));
  }
}

/* ========== 6. 其他交互 ========== */
document.getElementById('btnWalk').onclick = function () {
  state.steps += 1000;
  state.energy = Math.min(100, state.energy + 10);
  calcMood(); render(); moodTalk();
};
document.getElementById('btnSleep').onclick = function () {
  state.sleep = 8;
  state.energy = Math.min(100, state.energy + 25);
  calcMood(); render(); moodTalk();
};
document.getElementById('btnWeather').onclick = loadWeather;
document.getElementById('btnReset').onclick = function () {
  state = { food: 80, energy: 50, mood: 70, steps: 2000, sleep: 6, totalCalorie: 0 };
  calcMood(); render();
  preview.style.display = 'none';
  say('数据已重置，我们重新开始吧！');
};

/* ========== 7. 启动 ========== */
calcMood();
render();
loadWeather();
</script>
</body>
</html>
