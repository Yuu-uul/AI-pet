<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 电子宠物健康管理</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #a8c0ff 0%, #f0f4f8 100%);
    min-height: 100vh; margin: 0; padding: 20px;
    display: flex; justify-content: center;
  }
  .box {
    width: 100%; max-width: 420px; background: #fff;
    border-radius: 20px; padding: 24px; text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,.12);
  }
  h2 { margin: 0 0 6px; color: #333; }
  .weather {
    font-size: 14px; color: #666; background: #f0f7ff;
    border-radius: 10px; padding: 8px; margin-bottom: 14px;
  }
  .pet { font-size: 76px; margin: 10px 0; transition: transform .3s; }
  .pet.bounce { transform: scale(1.15); }
  .label { font-size: 13px; color: #888; text-align: left; margin-top: 10px; }
  .bar { background: #eee; border-radius: 10px; height: 18px; overflow: hidden; }
  .fill { height: 100%; color: #fff; font-size: 11px; line-height: 18px; padding-left: 8px; text-align: left; transition: width .5s; }
  #foodBar { background: #ff6b6b; }
  #energyBar { background: #4ecdc4; }
  #moodBar { background: #ffd93d; }
  #chat {
    background: #f8f9fa; border: 1px solid #e3e3e3; border-radius: 12px;
    padding: 14px; min-height: 56px; font-size: 14px; color: #555;
    margin: 16px 0; text-align: left; line-height: 1.6;
  }
  button {
    width: 100%; padding: 12px; margin: 6px 0; border: none;
    border-radius: 8px; background: #4a90e2; color: #fff;
    font-size: 15px; cursor: pointer;
  }
  button:active { background: #357abd; transform: scale(.98); }
  .btn-green { background: #4ecdc4; }
  .btn-orange { background: #ff9f43; }
  .btn-gray { background: #b2bec3; }
</style>
</head>
<body>

<div class="box">
  <h2>我的 AI 健康宠物</h2>
  <div class="weather" id="weather">🌤 正在获取天气...</div>

  <div class="pet" id="pet">🐶</div>

  <div class="label">饱食度（热量越低越好）</div>
  <div class="bar"><div class="fill" id="foodBar">80%</div></div>

  <div class="label">活力值（步数越多越好）</div>
  <div class="bar"><div class="fill" id="energyBar">50%</div></div>

  <div class="label">心情值</div>
  <div class="bar"><div class="fill" id="moodBar">70%</div></div>

  <div id="chat">主人，今天想吃什么呀？拍给我看看吧！</div>

  <button id="btnWalk" class="btn-green">🚶 模拟散步（+1000步）</button>
  <button id="btnEat" class="btn-orange">🍔 模拟吃大餐</button>
  <button id="btnSleep" class="btn-green">😴 模拟早睡</button>
  <button id="btnWeather" class="btn-gray">🔄 刷新天气</button>
  <button id="btnReset" class="btn-gray">↺ 重置数据</button>
</div>

<script>
/* ========== 1. 状态管理 ========== */
var state = JSON.parse(localStorage.getItem('petState')) || {
  food: 80, energy: 50, mood: 70, steps: 2000, sleep: 6
};

function save() { localStorage.setItem('petState', JSON.stringify(state)); }

/* ========== 2. 界面渲染 ========== */
function render() {
  setBar('foodBar', state.food);
  setBar('energyBar', state.energy);
  setBar('moodBar', state.mood);

  var pet = document.getElementById('pet');
  if (state.mood >= 80)      pet.textContent = '🐕';
  else if (state.mood >= 50) pet.textContent = '🐶';
  else if (state.mood >= 25) pet.textContent = '🐩';
  else                       pet.textContent = '🦮';

  pet.classList.add('bounce');
  setTimeout(function(){ pet.classList.remove('bounce'); }, 300);
  save();
}

function setBar(id, val) {
  var el = document.getElementById(id);
  el.style.width = val + '%';
  el.textContent = val + '%';
}

function say(t) { document.getElementById('chat').textContent = t; }

/* ========== 3. 心情系统（核心创新点） ========== */
function calcMood() {
  // 心情 = 饱食度、活力值、睡眠的综合加权
  var sleepScore = Math.min(100, state.sleep * 14);      // 睡7小时≈满分
  var mood = Math.round(state.food * 0.35 + state.energy * 0.35 + sleepScore * 0.30);
  state.mood = Math.max(0, Math.min(100, mood));
}

function moodTalk() {
  if (state.mood >= 85)      say('哇！主人今天超自律，我感觉自己是全世界最幸福的狗狗！🎉');
  else if (state.mood >= 65) say('今天状态不错哦，继续保持，我们一起变强！💪');
  else if (state.mood >= 45) say('嗯……有点小累，主人要不要陪我出去走走？');
  else if (state.mood >= 25) say('呜呜，我感觉不太舒服，主人是不是又熬夜了？😢');
  else                       say('我快撑不住了……求求主人早点睡觉，少吃点外卖吧！🥺');
}

/* ========== 4. 天气同步（免Key、免注册、支持跨域） ========== */
var WEATHER_CODE = {
  0:'☀️ 晴', 1:'🌤 大部晴朗', 2:'⛅ 多云', 3:'☁️ 阴',
  45:'🌫 雾', 48:'🌫 冻雾', 51:'🌦 毛毛雨', 53:'🌦 小雨', 55:'🌧 大雨',
  61:'🌧 小雨', 63:'🌧 中雨', 65:'⛈ 大雨', 71:'🌨 小雪', 73:'🌨 中雪',
  75:'❄️ 大雪', 80:'🌦 阵雨', 81:'🌧 阵雨', 82:'⛈ 强阵雨',
  95:'⛈ 雷阵雨', 96:'⛈ 雷阵雨伴冰雹', 99:'⛈ 强雷暴'
};

function loadWeather() {
  document.getElementById('weather').textContent = '🌤 正在获取天气...';
  // 深圳坐标；如需其他城市改经纬度即可
  var url = 'https://api.open-meteo.com/v1/forecast'
          + '?latitude=22.5431&longitude=114.0579'
          + '&current=temperature_2m,weather_code,relative_humidity_2m'
          + '&timezone=Asia/Shanghai';

  fetch(url)
    .then(function(r){ return r.json(); })
    .then(function(d){
      var c = d.current;
      var desc = WEATHER_CODE[c.weather_code] || '🌡 未知天气';
      document.getElementById('weather').textContent =
        '📍 深圳 ' + desc + ' ' + c.temperature_2m + '°C  湿度' + c.relative_humidity_2m + '%';
      weatherTalk(c.weather_code, c.temperature_2m);
    })
    .catch(function(){
      document.getElementById('weather').textContent = '⚠️ 天气获取失败，请检查网络';
    });
}

// 天气影响宠物心情 + 说话
function weatherTalk(code, temp) {
  if (code >= 61 && code <= 82) {          // 下雨
    state.mood = Math.max(0, state.mood - 8);
    say('外面下雨了，主人记得带伞哦！不过我有点想窝在家里……☔');
  } else if (temp >= 33) {                 // 高温
    state.mood = Math.max(0, state.mood - 5);
    say('好热呀！今天 ' + temp + '°C，主人多喝水，别把我晒化了～🥵');
  } else if (code === 0) {                 // 晴天
    state.mood = Math.min(100, state.mood + 6);
    say('今天是大晴天！阳光真好，主人快带我去户外跑一圈吧！☀️');
  } else {
    say('今天天气还行，主人出门记得注意安全哦～');
  }
  render();
}

/* ========== 5. 交互事件 ========== */
document.getElementById('btnWalk').onclick = function () {
  state.steps += 1000;
  state.energy = Math.min(100, state.energy + 10);
  calcMood(); render(); moodTalk();
};

document.getElementById('btnEat').onclick = function () {
  state.food = Math.max(0, state.food - 25);
  calcMood(); render(); moodTalk();
};

document.getElementById('btnSleep').onclick = function () {
  state.sleep = 8;
  state.energy = Math.min(100, state.energy + 25);
  calcMood(); render(); moodTalk();
};

document.getElementById('btnWeather').onclick = loadWeather;

document.getElementById('btnReset').onclick = function () {
  state = { food: 80, energy: 50, mood: 70, steps: 2000, sleep: 6 };
  calcMood(); render();
  say('数据已重置，我们重新开始吧！');
};

/* ========== 6. 启动 ========== */
calcMood();
render();
loadWeather();
</script>
</body>
</html>
